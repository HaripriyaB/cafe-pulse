<!DOCTYPE html>
<html>
<head>
  <title>Cafe Pulse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f4ef;
      margin: 0;
      padding: 40px;
      color: #2d2926;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 120px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      margin-top: 15px;
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      background: #6b3f25;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 10px;
      display: none;
    }

    .feedback {
      border-bottom: 1px solid #eee;
      padding: 15px 0;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      background: #eee;
      font-size: 13px;
    }

    .input-container {
  position: relative;
}

.voice-button {
  margin-top: 10px;
  background: #444;
}

.voice-button.listening {
  background: #c0392b;
}

.voice-status {
  min-height: 20px;
  margin-top: 8px;
  font-size: 14px;
  color: #777;
}
  </style>
</head>

<body>

<div class="container">

  <h1>☕ Cafe Pulse</h1>

  <div class="subtitle">
    Don't just collect feedback. Understand the room.
  </div>

  <div class="card">

    <h2>How was your cafe experience?</h2>

    <div class="input-container">

  <textarea
    id="feedback"
    placeholder="Tell us what happened..."
  ></textarea>

  <button
    id="voiceButton"
    class="voice-button"
    onclick="toggleVoiceInput()"
  >
    🎙️ Speak
  </button>

</div>

<div id="voiceStatus" class="voice-status"></div>

<button id="submit" onclick="submitFeedback()">
  Analyze Feedback
</button>

    <div id="result" class="result"></div>

  </div>

  <div class="card">

    <h2>Recent Customer Feedback</h2>

    <div id="feedbackList">
      Loading...
    </div>

  </div>

</div>

<script>

  // ================================
// Voice to Text
// ================================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;
let isListening = false;

if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = "en-IN";

  recognition.onstart = function () {

    isListening = true;

    const button = document.getElementById("voiceButton");
    const status = document.getElementById("voiceStatus");

    button.innerText = "🔴 Listening...";
    button.classList.add("listening");

    status.innerText = "Speak now...";
  };

  recognition.onresult = function (event) {

    let transcript = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {
      transcript += event.results[i][0].transcript;
    }

    const textarea = document.getElementById("feedback");

    textarea.value = transcript;
  };

  recognition.onerror = function (event) {

    console.error("Speech recognition error:", event.error);

    const status = document.getElementById("voiceStatus");

    if (event.error === "not-allowed") {
      status.innerText =
        "Microphone permission was denied.";
    } else {
      status.innerText =
        "Couldn't recognize speech. Please try again.";
    }

    stopVoiceInput();
  };

  recognition.onend = function () {
    stopVoiceInput();
  };

} else {

  document.getElementById("voiceButton").disabled = true;

  document.getElementById("voiceStatus").innerText =
    "Voice input is not supported in this browser.";
}


function toggleVoiceInput() {

  if (!recognition) {
    return;
  }

  if (isListening) {

    recognition.stop();

  } else {

    recognition.start();

  }
}


function stopVoiceInput() {

  isListening = false;

  const button = document.getElementById("voiceButton");
  const status = document.getElementById("voiceStatus");

  button.innerText = "🎙️ Speak";
  button.classList.remove("listening");

  if (status.innerText === "Speak now...") {
    status.innerText = "Voice input complete.";
  }
}

async function submitFeedback() {

  const input = document.getElementById("feedback");
  const button = document.getElementById("submit");
  const result = document.getElementById("result");

  const message = input.value.trim();

  if (!message) {
    alert("Please enter some feedback.");
    return;
  }

  button.disabled = true;
  button.innerText = "🤖 Gemini is analyzing...";

  try {

    const response = await fetch("/api/feedback", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Something went wrong");
    }

    result.style.display = "block";

    result.innerHTML = `
      <h3>${getEmoji(data.sentiment)} ${data.sentiment}</h3>

      <p><strong>Category:</strong> ${data.category}</p>

      <p><strong>Severity:</strong> ${data.severity}/5</p>

      <p><strong>Summary:</strong><br>
      ${data.summary}</p>

      <p><strong>🤖 AI Recommendation:</strong><br>
      ${data.suggested_action}</p>
    `;

    input.value = "";

    loadFeedback();

  } catch (error) {

    result.style.display = "block";

    result.innerHTML = `
      <strong>Error:</strong> ${error.message}
    `;

  } finally {

    button.disabled = false;
    button.innerText = "Analyze Feedback";

  }
}


function getEmoji(sentiment) {

  if (sentiment === "positive") return "😊";
  if (sentiment === "negative") return "😡";

  return "😐";
}


async function loadFeedback() {

  try {

    const response = await fetch("/api/feedback");

    const feedback = await response.json();

    const container = document.getElementById("feedbackList");

    if (!feedback.length) {
      container.innerHTML = "No feedback yet.";
      return;
    }

    container.innerHTML = feedback.map(item => `
      <div class="feedback">

        <span class="badge">
          ${getEmoji(item.sentiment)}
          ${item.category}
        </span>

        <p>${item.message}</p>

        <small>
          AI: ${item.summary}
        </small>

      </div>
    `).join("");

  } catch (error) {

    document.getElementById("feedbackList").innerText =
      "Unable to load feedback.";

  }
}

loadFeedback();

</script>

</body>
</html>
